server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Evita que o navegador retenha versão antiga do index.html em cache após atualizações
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # Proxy para API da Binance (elimina bloqueios de CORS e geo-restrições de navegador)
    location /binance-api/ {
        proxy_pass https://api.binance.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.binance.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    location /binance-fapi/ {
        proxy_pass https://fapi.binance.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host fapi.binance.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    location /binance-future-testnet/ {
        proxy_pass https://testnet.binancefuture.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host testnet.binancefuture.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    location /binance-spot-testnet/ {
        proxy_pass https://testnet.binance.vision/;
        proxy_ssl_server_name on;
        proxy_set_header Host testnet.binance.vision;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # Proxy para Yahoo Finance (Forex, Metais e CFDs)
    location /yahoo-api/ {
        proxy_pass https://query1.finance.yahoo.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host query1.finance.yahoo.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)";
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # Proxy Reverso para o Gateway HTTP do MetaTrader e Hub (elimina Mixed Content e CORS quando a Web roda em HTTPS)
    location /gateway/ {
        proxy_pass http://144.126.141.254/;
        proxy_set_header Host 144.126.141.254;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # Proxy Reverso para o WebSocket Hub
    location /ws {
        proxy_pass http://144.126.141.254/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
